<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#2b2320">
<title>深宫录 · 试玩原型</title>
<style>
:root{
  --bg:#1c1815; --paper:#f3e9d6; --paper2:#e9dcc2; --ink:#2b2320; --ink2:#5b4e42;
  --line:#c8b48e; --gold:#b8913f; --red:#8f2f26; --red2:#b23a2e; --jade:#3f6b5b;
  --blue:#39536e; --muted:#8a7a63; --white:#fffaf0; --shadow:rgba(0,0,0,.35);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:"Songti SC","STSong","SimSun","Noto Serif SC",serif;
  background:radial-gradient(circle at 50% 0%,#3a3029,#1c1815 70%);
  color:var(--ink);display:flex;justify-content:center;
  overflow:hidden;user-select:none;
}
#app{
  width:100%;max-width:460px;height:100dvh;background:var(--paper);
  position:relative;display:flex;flex-direction:column;
  box-shadow:0 0 40px var(--shadow);overflow:hidden;
}
.screen{flex:1;display:flex;flex-direction:column;min-height:0;animation:fade .28s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.scroll{overflow-y:auto;-webkit-overflow-scrolling:touch;flex:1;padding:16px}

/* 通用 */
.title{font-size:26px;letter-spacing:6px;text-align:center;color:var(--red);font-weight:700}
.sub{font-size:12px;color:var(--muted);text-align:center;letter-spacing:2px;margin-top:6px}
.sec-title{font-size:15px;color:var(--red);border-left:3px solid var(--red);padding-left:8px;margin:14px 0 10px;letter-spacing:1px}
.hint{font-size:11px;color:var(--muted);line-height:1.7}
.card{background:var(--white);border:1px solid var(--line);border-radius:8px;padding:14px;margin-bottom:12px;
  box-shadow:0 2px 6px rgba(90,70,40,.08)}
.btn{display:block;width:100%;padding:13px;margin:8px 0;background:var(--paper2);border:1px solid var(--line);
  border-radius:6px;color:var(--ink);font-size:15px;font-family:inherit;letter-spacing:2px;cursor:pointer;transition:.15s}
.btn:active{transform:scale(.98);background:#ddcdae}
.btn.primary{background:linear-gradient(180deg,var(--red2),var(--red));color:#fff;border-color:var(--red);font-weight:700}
.btn.jade{background:linear-gradient(180deg,#4c816e,var(--jade));color:#fff;border-color:var(--jade)}
.btn.blue{background:linear-gradient(180deg,#48688a,var(--blue));color:#fff;border-color:var(--blue)}
.btn.ghost{background:transparent;color:var(--muted);border-style:dashed}
.btn.sm{padding:8px;font-size:13px;margin:4px 0;letter-spacing:1px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:8px}.row>*{flex:1}
.tag{display:inline-block;font-size:11px;padding:2px 8px;border-radius:20px;background:var(--paper2);color:var(--ink2);border:1px solid var(--line)}
.tag.hot{background:#f6e2dd;color:var(--red);border-color:#e5b9b0}

/* 启动页 */
.splash{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
  background:linear-gradient(180deg,#231d19,#2e251f);padding:30px;text-align:center}
.seal{width:76px;height:76px;border:3px solid var(--gold);color:var(--gold);border-radius:8px;
  display:flex;align-items:center;justify-content:center;font-size:34px;letter-spacing:0;margin-bottom:22px;
  box-shadow:0 0 0 4px #231d19,0 0 0 5px var(--gold);font-weight:700}
.splash h1{color:var(--paper);font-size:44px;letter-spacing:14px;font-weight:700;text-indent:14px}
.splash .en{color:var(--gold);letter-spacing:5px;font-size:11px;margin-top:10px;opacity:.8}
.splash .line{width:200px;height:1px;background:linear-gradient(90deg,transparent,var(--gold),transparent);margin:26px 0}
.splash .btn{max-width:260px;background:transparent;color:var(--paper);border-color:var(--gold);letter-spacing:4px}
.splash .btn:active{background:rgba(184,145,63,.2)}
.splash .foot{position:absolute;bottom:16px;color:#6f6152;font-size:10px;letter-spacing:1px}

/* 路线卡 */
.route-card{position:relative;overflow:hidden;transition:.18s}
.route-card:active{transform:scale(.99)}
.route-card .rtop{display:flex;align-items:center;gap:10px}
.route-card .ricon{width:42px;height:42px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  font-size:17px;color:var(--ink);flex-shrink:0;font-weight:700;border:2px solid var(--gold);background:var(--paper2)}
.route-card h3{font-size:18px;letter-spacing:2px}
.route-card .rline{font-size:11px;color:var(--muted);margin-top:2px}
.route-card ul{list-style:none;margin-top:10px;font-size:12px;color:var(--ink2);line-height:1.9}
.route-card li:before{content:"· ";color:var(--gold);font-weight:700}
.rc-consort .ricon{background:#f6e2dd;border-color:var(--red);color:var(--red)}
.rc-maid .ricon{background:#e3efe8;border-color:var(--jade);color:var(--jade)}
.rc-official .ricon{background:#e2e9f0;border-color:var(--blue);color:var(--blue)}

/* 顶部状态栏 */
.topbar{background:linear-gradient(180deg,#2e2620,#241d18);color:var(--paper);padding:10px 14px;
  display:flex;align-items:center;justify-content:space-between;flex-shrink:0;border-bottom:2px solid var(--gold)}
.tb-date{font-size:13px;letter-spacing:1px}.tb-date b{color:var(--gold);font-size:15px}
.tb-stats{display:flex;gap:10px;font-size:11px;flex-wrap:wrap;justify-content:flex-end;max-width:60%}
.tb-stats span{white-space:nowrap}.tb-stats b{color:#e9c877}
.ap-dots{display:inline-flex;gap:2px;vertical-align:middle;margin-left:3px}
.ap-dots i{width:6px;height:6px;border-radius:50%;background:#5a4e42;display:block}
.ap-dots i.on{background:var(--gold)}
.route-badge{font-size:10px;padding:1px 6px;border-radius:3px;border:1px solid var(--gold);color:var(--gold)}

/* 主界面地图 */
.mainmap{flex:1;overflow-y:auto;padding:14px}
.maphead{text-align:center;margin-bottom:12px}
.maphead .mt{font-size:18px;letter-spacing:4px;color:var(--ink)}
.maphead .md{font-size:11px;color:var(--muted);margin-top:4px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.locate{background:var(--white);border:1px solid var(--line);border-radius:8px;padding:12px 10px;text-align:center;
  cursor:pointer;transition:.15s;position:relative;min-height:74px;display:flex;flex-direction:column;justify-content:center}
.locate:active{transform:scale(.96)}
.locate .li{font-size:22px;margin-bottom:2px}
.locate .ln{font-size:14px;letter-spacing:1px}
.locate .ld{font-size:10px;color:var(--muted);margin-top:3px;line-height:1.4}
.locate.locked{filter:grayscale(1);opacity:.5;cursor:not-allowed}
.locate .lk{position:absolute;top:4px;right:6px;font-size:10px;color:var(--red)}
.locate.hotspot{border-color:var(--gold);box-shadow:inset 0 0 0 1px var(--gold)}

/* 底部导航 */
.navbar{display:flex;background:linear-gradient(180deg,#26201b,#1e1915);border-top:2px solid var(--gold);
  flex-shrink:0;padding:6px 2px calc(6px + env(safe-area-inset-bottom))}
.nav{flex:1;text-align:center;color:#9c8d78;cursor:pointer;padding:4px 0;transition:.15s}
.nav:active{transform:scale(.92)}
.nav .ni{font-size:19px;display:block;line-height:1.2}
.nav .nl{font-size:10px;letter-spacing:1px;margin-top:2px;display:block}
.nav.active{color:var(--gold)}
.nav.hidden{display:none}

/* 属性面板 */
.stat-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.stat{background:var(--paper2);border-radius:6px;padding:8px 10px;font-size:12px}
.stat .sv{float:right;font-weight:700;color:var(--red)}
.bar{height:5px;background:#d8c8a6;border-radius:3px;margin-top:5px;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),var(--red));border-radius:3px}
.kv{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px dashed var(--line);font-size:13px}
.kv:last-child{border:none}.kv b{color:var(--red)}

/* NPC / 好感 */
.npctabs{display:flex;gap:8px;margin-bottom:10px;border-bottom:1px solid var(--line)}
.npctab{flex:1;background:none;border:none;padding:8px 4px;font-size:13px;color:var(--muted);
  border-bottom:2px solid transparent;cursor:pointer;font-family:inherit}
.npctab.on{color:var(--red);border-bottom-color:var(--red);font-weight:700}
.npc{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px dashed var(--line)}
.npc:last-child{border:none}
.npc .face{width:38px;height:38px;border-radius:50%;background:var(--paper2);border:1px solid var(--line);
  display:flex;align-items:center;justify-content:center;font-size:17px;flex-shrink:0;color:var(--ink2)}
.npc .info{flex:1;min-width:0}
.npc .nn{font-size:13px;font-weight:700}
.npc .nr{font-size:10px;color:var(--muted);margin:1px 0}
.npc .stage{font-size:10px;color:var(--gold)}
.affbar{height:6px;background:#e0d3b6;border-radius:3px;margin-top:4px;overflow:hidden}
.affbar i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),var(--red2))}

/* 弹窗 */
.mask{position:absolute;inset:0;background:rgba(20,15,12,.72);display:flex;align-items:flex-end;z-index:30;
  animation:fade .2s ease}
.dialog{width:100%;max-height:88%;background:var(--paper);border-radius:14px 14px 0 0;overflow:hidden;
  display:flex;flex-direction:column;animation:up .3s cubic-bezier(.2,.8,.2,1)}
@keyframes up{from{transform:translateY(100%)}to{transform:none}}
.dg-head{padding:16px 18px 10px;border-bottom:1px solid var(--line);text-align:center;position:relative;flex-shrink:0}
.dg-head h2{font-size:18px;letter-spacing:3px;color:var(--red)}
.dg-head .x{position:absolute;right:12px;top:12px;font-size:20px;color:var(--muted);cursor:pointer;line-height:1}
.dg-body{padding:16px 18px;overflow-y:auto;flex:1}
.story-text{font-size:14px;line-height:2;color:var(--ink);text-indent:2em;margin-bottom:16px;
  background:var(--white);border:1px solid var(--line);border-radius:6px;padding:14px}
.choices .btn{margin:7px 0}
.result-line{font-size:13px;line-height:1.9;padding:8px 10px;background:var(--white);border-left:3px solid var(--gold);
  border-radius:4px;margin:6px 0}
.delta{color:var(--red);font-weight:700}.delta.neg{color:var(--jade)}

/* 提示 toast */
.toast{position:absolute;top:64px;left:50%;transform:translateX(-50%);background:rgba(35,28,23,.94);
  color:var(--paper);padding:10px 18px;border-radius:24px;font-size:13px;z-index:50;letter-spacing:1px;
  border:1px solid var(--gold);animation:fade .2s;max-width:90%;text-align:center}

/* 存档槽 */
.slot{display:flex;align-items:center;justify-content:space-between;padding:12px;background:var(--white);
  border:1px solid var(--line);border-radius:8px;margin-bottom:9px}
.slot .si{font-size:12px;line-height:1.6}
.slot .si b{font-size:14px;color:var(--ink)}
.slot .empty{color:var(--muted);font-style:italic}
.slot .btn{width:auto;padding:7px 14px;margin:0;font-size:12px}

.empty-tip{text-align:center;color:var(--muted);font-size:12px;padding:30px 10px;line-height:2}
/* 皇帝画像卡：头像固定 3:4 比例，与性情标签并排 */
.emp-portrait-card{display:flex;align-items:center;gap:14px;text-align:left}
.emp-portrait{width:96px;height:128px;object-fit:cover;object-position:top center;flex-shrink:0;
  border-radius:8px;border:2px solid var(--gold);background:var(--paper2)}
/* 太后头像：方形圆形构图，裁为圆形展示 */
.emp-portrait.round{width:96px;height:96px;border-radius:50%;object-fit:cover;object-position:center}
.emp-tag{display:inline-block;margin-top:5px;font-size:10px;padding:2px 8px;border-radius:10px;
  background:var(--red);color:#fff}
.foot-note{text-align:center;font-size:10px;color:var(--muted);padding:10px;line-height:1.8}
.year-end{background:linear-gradient(180deg,#f6ead0,#ecd9b4);border:2px solid var(--gold);border-radius:10px;
  padding:18px;text-align:center;margin:10px 0}
.year-end h3{color:var(--red);letter-spacing:4px;font-size:20px;margin-bottom:10px}
/* 结算明细 */
.delta-list{display:flex;flex-wrap:wrap;gap:6px;padding:10px}
.delta-chip{display:inline-block;font-size:12px;padding:5px 11px;border-radius:14px;border:1px solid var(--line);background:var(--paper2);white-space:nowrap}
.delta-chip.up{color:var(--red);border-color:#e0b3aa;background:#f9ece8}
.delta-chip.down{color:var(--jade);border-color:#a9c6b8;background:#eaf3ee}
.delta-chip.aff{color:#6a4a8a;border-color:#c4add9;background:#f2eaf8}
.delta-chip.attr{color:#8a6a1a;border-color:#d9c48a;background:#f8f2e0}
/* 攻略 */
.guide-row{display:flex;align-items:center;gap:8px;padding:8px;border-bottom:1px dashed var(--line);font-size:12px}
.guide-row .gi{width:26px;height:26px;border-radius:50%;background:var(--paper2);display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:11px}
.guide-row.done .gi{background:var(--jade);color:#fff}
.guide-row.now{background:#f6ead0;border-left:3px solid var(--red)}
.guide-row.now .gi{background:var(--red);color:#fff}
.guide-row.ready .gi{background:var(--gold);color:#fff}
.guide-row .gn{flex:1;min-width:0}
.guide-row .gn b{font-size:13px}
.guide-row .gc{font-size:11px;color:var(--muted);margin-top:2px;line-height:1.5}
.guide-row .gs{font-size:11px;white-space:nowrap;text-align:right}
.guide-row.done .gs{color:var(--jade)}
.guide-row.now .gs{color:var(--red);font-weight:700}
.guide-row.ready .gs{color:var(--gold)}
/* 商店 / 侍从 / NPC操作 */
.shop-item,.servant{display:flex;justify-content:space-between;align-items:center;padding:9px 10px;background:var(--white);border:1px solid var(--line);border-radius:6px;margin-bottom:7px;font-size:12px;gap:8px}
.npc-actions{display:flex;gap:4px;flex-shrink:0}
.npc-actions .btn{padding:4px 8px;font-size:11px;width:auto;margin:0}
.sec-badge{display:inline-block;font-size:10px;padding:1px 7px;border-radius:10px;background:var(--gold);color:#fff;margin-left:6px}
/* 皇宫舆图：底图 + 热区 */
.map-canvas{position:relative;width:100%;aspect-ratio:1000/1333;border:1px solid var(--line);
  border-radius:8px;overflow:hidden;box-shadow:0 2px 8px rgba(0,0,0,.18);background:var(--paper2)}
.map-canvas img{display:block;width:100%;height:100%;object-fit:cover}
.map-pin{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;
  gap:2px;padding:2px;border:0;background:none;cursor:pointer;z-index:2;width:auto}
.pin-ico{width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  font-size:14px;background:rgba(255,250,240,.94);border:2px solid var(--red);
  box-shadow:0 2px 5px rgba(0,0,0,.35)}
.pin-name{font-size:10px;line-height:1.2;padding:1px 5px;border-radius:8px;white-space:nowrap;
  background:rgba(43,35,32,.82);color:var(--white);letter-spacing:1px}
.map-pin.locked .pin-ico{background:rgba(220,210,190,.85);border-color:var(--muted);filter:grayscale(.6)}
.map-pin.locked .pin-name{background:rgba(90,80,70,.6);color:#e6ded0}
.map-pin:active .pin-ico{transform:scale(.9)}
/* 手动跨月按钮 + 行动力耗尽禁用态 */
.btn.next-month{width:100%;margin-top:14px;padding:12px;font-size:15px;letter-spacing:2px;font-weight:700;
  background:linear-gradient(135deg,#8e6b1f,#c9a227);color:#fff8e8;border:1px solid #7a5a18;
  box-shadow:0 2px 8px rgba(140,105,30,.35)}
.btn.next-month.urgent{animation:nmPulse 1.3s ease-in-out infinite}
@keyframes nmPulse{0%,100%{box-shadow:0 0 4px rgba(190,60,50,.5)}50%{box-shadow:0 0 14px rgba(190,60,50,.95)}}
.btn:disabled{opacity:.4;filter:grayscale(.7);cursor:not-allowed}
/* 子嗣 */
.kid-card{padding:10px 12px}
.kid-top{display:flex;gap:10px;align-items:center}
.kid-avatar{width:40px;height:40px;flex:0 0 40px;border-radius:50%;background:var(--paper2);
  display:flex;align-items:center;justify-content:center;font-size:22px;border:1px solid var(--line)}
.kid-meta{flex:1;font-size:13px;color:var(--ink)}
.kid-meta .hint{margin-top:2px}
.kid-acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px}
.kid-acts .btn{flex:1;min-width:88px}
/* 寝宫 */
.pal-tier{display:flex;justify-content:space-between;align-items:center;font-size:11px;color:var(--muted);margin-bottom:8px}
.pal-tier b{color:var(--red)}
.pal-banner{width:100%;border:1px solid var(--line);border-radius:8px;overflow:hidden;margin-bottom:10px;line-height:0;position:relative}
.pal-banner img{width:100%;display:block}
.pal-banner.imgerr{min-height:120px;background:var(--paper2)}
.pal-banner.imgerr:after{content:'⚠ 寝宫图未加载 · 请确认 palace_*.jpg 已上传';position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#a00;font-size:12px;line-height:1.6;text-align:center;padding:10px}
.pal-item{display:flex;align-items:center;gap:10px;padding:9px 10px;border:1px solid var(--line);border-radius:8px;margin-bottom:7px;background:var(--paper2)}
.pal-ico{width:36px;height:36px;flex:0 0 36px;border-radius:8px;background:var(--paper);display:flex;align-items:center;justify-content:center;font-size:19px}
.pal-info{flex:1;min-width:0}
.pal-nm{font-size:13px;font-weight:700;color:var(--ink)}
.pal-ds{font-size:11px;color:var(--muted);margin-top:2px;line-height:1.4}
 .pal-new{display:inline-block;font-size:9px;padding:1px 6px;border-radius:8px;background:var(--red);color:#fff;margin-left:6px;vertical-align:middle}
.pal-item .btn{width:auto;flex:0 0 auto;margin:0;padding:7px 14px;font-size:12px}
/* 寝宫底图热区 */
.pal-canvas{position:relative;width:100%;aspect-ratio:900/1200;border:1px solid var(--line);
  border-radius:8px;overflow:hidden;box-shadow:0 2px 8px rgba(0,0,0,.18);background:var(--paper2)}
.pal-canvas img{display:block;width:100%;height:100%;object-fit:cover}
.pal-canvas.imgerr{min-height:160px}
.pal-canvas.imgerr:after{content:'⚠ 寝宫图未加载 · 请确认 palace_*.jpg 已上传';position:absolute;inset:0;
  display:flex;align-items:center;justify-content:center;color:#a00;font-size:12px;line-height:1.6;text-align:center;padding:10px}
.pal-pin{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;
  gap:2px;padding:2px;border:0;background:none;cursor:pointer;z-index:2;width:auto}
.pp-ico{width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  font-size:14px;background:rgba(255,250,240,.95);border:2px solid var(--red);box-shadow:0 2px 5px rgba(0,0,0,.35)}
.pp-name{font-size:10px;line-height:1.2;padding:1px 5px;border-radius:8px;white-space:nowrap;
  background:rgba(43,35,32,.85);color:var(--white);letter-spacing:.5px;position:relative}
.pp-name i{font-style:normal;font-size:9px;color:#fff;background:var(--red);border-radius:6px;padding:0 4px;margin-left:3px}
.pal-pin.pin-off .pp-ico{background:rgba(220,210,190,.85);border-color:var(--muted);filter:grayscale(.6)}
.pal-pin.pin-off{opacity:.72}
.pal-legend{display:flex;gap:16px;justify-content:center;font-size:10px;color:var(--muted);margin-top:8px}
.pal-legend span{display:inline-flex;align-items:center;gap:4px}
.pal-legend i{width:9px;height:9px;border-radius:50%;display:inline-block}
.lg-new{background:var(--red)}.lg-base{background:rgba(43,35,32,.6)}
/* 结局 */
.ending-wrap{padding:30px 20px;text-align:center}
.ending-seal{width:62px;height:62px;line-height:56px;margin:6px auto 18px;border:3px solid var(--red);
  color:var(--red);font-size:32px;border-radius:8px;transform:rotate(-6deg)}
.ending-title{font-size:25px;letter-spacing:8px;color:var(--red);font-weight:700}
.ending-sub{font-size:12px;color:var(--muted);letter-spacing:3px;margin-top:8px}
.ending-wrap .story-text{text-align:left}
.ending-wrap .card{text-align:left}
</style>
</head>
<body>
<div id="app"></div>

<script>

function pick(arr){return arr[Math.floor(Math.random()*arr.length)]}
function rollFamily(){let t=CFG.family.reduce((s,f)=>s+CFG.familyInfo[f].w,0),r=Math.random()*t;
  for(const f of CFG.family){r-=CFG.familyInfo[f].w;if(r<=0)return f}return 'COMMONER'}
function rollOrigin(fam){
  const fi=CFG.familyInfo[fam],t=pick(fi.titles);
  return {rank:t[0],office:t[1],kin:pick(fi.kin)};
}
function familyDesc(d){
  const o=d.origin||rollOrigin(d.family);
  return '你是「'+o.rank+o.office+'」的'+o.kin;
}
/* 秀女入宫位份：家世定基础，嫡女高一级，上限贵人 */
function startRankFor(d){
  const m=CFG.startRank[d.family]||CFG.startRank.COMMONER;
  return (d.origin&&d.origin.kin==='嫡女'&&m.elite)?m.elite:m.base;
}
function draftStartLabel(d){
  if(S.createRoute==='CONSORT'){
    const r=CFG.ranks.CONSORT.find(x=>x[0]===startRankFor(d));
    return r?r[1]:'官女子';
  }
  return S.createRoute==='MAID'?'粗使宫女':'女史';
}
function newDraft(){
  const fam=rollFamily(),fi=CFG.familyInfo[fam];const attrs={};
  for(const k in fi.r)attrs[k]=rnd(fi.r[k][0],fi.r[k][1]);
  return {name:'',age:rnd(CFG.startAge.min,CFG.startAge.max),family:fam,origin:rollOrigin(fam),attributes:attrs,
    silver:fi.silver,freeFamily:3,freeAttr:3,adFamily:0,adAttr:0};
}
/* 家世刷新：只换家世、出身文案与初始银两，不动属性 */
function rerollFamily(d){
  const fam=rollFamily(),fi=CFG.familyInfo[fam];
  d.family=fam;d.origin=rollOrigin(fam);d.silver=fi.silver;d.age=rnd(CFG.startAge.min,CFG.startAge.max);
}
/* 属性刷新：在当前家世范围内重掷五维，不动家世 */
function rerollAttr(d){
  const fi=CFG.familyInfo[d.family];
  for(const k in fi.r)d.attributes[k]=rnd(fi.r[k][0],fi.r[k][1]);
}
function validateName(n){
  n=(n||'').trim();
  if(n.length<CFG.nameMin||n.length>CFG.nameMax)return {ok:false,reason:'姓名需 '+CFG.nameMin+'~'+CFG.nameMax+' 字'};
  if(!/^[\u4e00-\u9fa5·]+$/.test(n))return {ok:false,reason:'仅允许汉字与间隔号·'};
  if(CFG.sensitive.some(w=>n.includes(w)))return {ok:false,reason:'含有不雅或禁用字词'};
  return {ok:true};
}

/* 构建存档 */
/* 子嗣唯一 id */
function childUid(){return 'k'+Date.now().toString(36)+Math.floor(Math.random()*1000).toString(36)}
/* 皇帝取名：姓氏库 + 单/双字名（用字去重复，避免"桢"重复被抽中） */
function nameCharPool(){return Array.from(new Set(CFG.emperor.nameChars))}
function genGivenName(){
  const pool=nameCharPool();
  const a=pick(pool);
  let b=pick(pool),guard=0;
  while(b===a&&guard++<20)b=pick(pool);
  if(b===a)b=pool[(pool.indexOf(a)+1)%pool.length];
  return Math.random()<0.5?a:a+b; // 单字名 或 双字名
}
function genEmperorName(){
  const surname=pick(CFG.emperor.surnames);
  const given=genGivenName();
  return {surname,given,full:surname+given};
}
/* 妃嫔取名：姓不与皇帝同姓，单姓+单/双字名，总长≤4字，古风文雅 */
function genConsortName(g,used){
  used=used||{};
  const empSur=(g&&g.emperor&&g.emperor.surname)||'';
  const surs=CFG.haremNpc.surs.filter(s=>s!==empSur); // 排除皇帝姓
  const ch=CFG.haremNpc.given;
  let name='',guard=0;
  do{
    const s=pick(surs);
    const given=Math.random()<0.45?pick(ch):pick(ch)+pick(ch);
    name=s+given;
  }while((used[name]||name.length>4)&&guard++<60);
  if(name.length>4)name=name.slice(0,4); // 兜底截断，确保≤4字
  used[name]=1;
  return name;
}
/* 生成初始后宫 NPC：5~8位（含少量皇后概率），返回 {id:npc} */
function genHaremNpcs(g){
  const cfg=CFG.haremNpc;
  const n=rnd(cfg.countMin,cfg.countMax);
  const npcs={},used={};
  // 位份分配：随机洗牌 rankPool，取前 n 个；有概率安插一位皇后
  const pool=cfg.rankPool.slice().sort(()=>Math.random()-0.5);
  const hasEmpress=Math.random()<cfg.empressProb;
  for(let i=0;i<n;i++){
    const id='cnp_h'+i;
    let rank=pool[i%pool.length];
    if(hasEmpress&&i===0)rank='HUANG_HOU';
    const name=genConsortName(g,used);
    npcs[id]={id,name,rank,age:rnd(cfg.ageMin,cfg.ageMax),
      constitution:rnd(cfg.conMin,cfg.conMax),alive:true,inCold:false,desc:pick(cfg.descs)};
  }
  return npcs;
}
/* 皇子公主取名：冠皇帝姓，名字同样取自帝王用字库 */
function royalName(g){
  const gender=Math.random()<0.5?'男':'女';
  const sur=(g&&g.emperor&&g.emperor.surname)||(S.game&&S.game.emperor&&S.game.emperor.surname)||'萧';
  const given=genGivenName();
  return {name:sur+given,gender,surname:sur,given};
}
/* 初始化后宫嫔妃子嗣（开局已有几位妃嫔诞下皇嗣） */
function seedConsortChildren(g){
  const mothers=liveConsorts(g).map(n=>[n.id,n.name]);
  const n=rnd(2,4);
  const chosen=[];
  const pool=mothers.slice();
  for(let i=0;i<n&&pool.length;i++){
    const idx=Math.floor(Math.random()*pool.length);
    const m=pool.splice(idx,1)[0];chosen.push(m);
  }
  chosen.forEach(m=>{
    const rn=royalName(g);
    g.children.push({uid:childUid(),name:rn.name,given:rn.given,surname:rn.surname,gender:rn.gender,age:rnd(1,6),
      mother:m[0],motherName:m[1],isMine:false,birthMother:m[1],
      fosterBy:null});
  });
  autoSchoolOthers(g); // 开局已满六岁的他妃皇嗣自动入上书房
}
/* 他妃所出皇嗣满六岁自动入上书房（非主控亲生/领养），无需玩家操作、不耗行动力 */
function autoSchoolOthers(g){
  if(!g||!Array.isArray(g.children))return;
  g.children.forEach(k=>{
    if(k.isMine||k.adopted)return;           // 主控亲生/领养仍由玩家手动入学
    if((k.age||0)<6)return;
    if(k.school)return;
    k.school=1;                               // 自动入学，学业自 1 起随月增长
    addLog(g,'皇嗣「'+k.name+'」年满六岁，已按宫例送入上书房读书。');
  });
}
/* 每月推进子嗣年龄 + 嫔妃有概率诞育新子嗣 */
function monthlyChildren(g){
  g.children.forEach(k=>{
    if(typeof k.age==='number')k.age+=1;
    if(k.school)k.school+=1; // 在上书房就学，学业随月增长
  });
  autoSchoolOthers(g);
  if(g.c.route!=='CONSORT')return;
  if(Math.random()<0.28){
    const pool=liveConsorts(g).map(n=>[n.id,n.name]);
    if(!pool.length)return;
    const m=pick(pool),rn=royalName(g);
    g.children.push({uid:childUid(),name:rn.name,given:rn.given,surname:rn.surname,gender:rn.gender,age:0,
      mother:m[0],motherName:m[1],isMine:false,birthMother:m[1],fosterBy:null});
    addLog(g,'宫中传来喜讯：'+m[1]+'诞下'+rn.gender+'婴「'+rn.name+'」。');
    S.pendingFlows.push({stage:'result',title:'宫中添丁',
      resultText:m[1]+'诞下'+rn.gender+'婴，取名「'+rn.name+'」。后宫又添一位皇嗣。',
      deltas:[{t:'皇嗣 +1 · '+rn.name,pos:true,k:'aff'}],promoted:null,yearEnd:false});
  }
}
function buildGame(draft,route,bureau){
  const g={
    v:1,
    c:{name:draft.name||'无名氏', age:draft.age,
      family:draft.family,origin:draft.origin||rollOrigin(draft.family),attributes:{...draft.attributes},silver:draft.silver,route,bureau,
      rank:route==='CONSORT'?startRankFor(draft):route==='MAID'?'CU_SHI':'NV_SHI',
      favor:0,prestige:0,diligence:0,merit:0,reputation:0,
      married:false,husband:null,debuffs:[],servants:[],isDowager:false,inColdUntil:0},
    time:{year:1,month:1,ap:CFG.actionMax},
    ministers:{}, consorts:{},
    inventory:{},children:[],dutyCompleted:[],
    pregnant:null,
    emperor:(()=>{const p=CFG.emperor.personas[Math.floor(Math.random()*CFG.emperor.personas.length)];const nm=genEmperorName();
      return {health:82,mood:p.mood,persona:p.key,surname:nm.surname,given:nm.given,name:nm.full,
        age:CFG.emperor.age,deathAge:rnd(CFG.emperorLife.deathMin,CFG.emperorLife.deathMax),alive:true,heir:null,reign:1}})(),
    // 太后（慈宁宫）：初始年龄40-60，驾崩年龄≤70
    dowager:(()=>{const age=rnd(CFG.dowager.ageMin,CFG.dowager.ageMax);
      return {name:'章太后',age,deathAge:rnd(Math.min(70,age+3),CFG.dowager.deathMax),alive:true}})(),
    // 后宫顶层席位：由初始动态后宫位份决定（见下方 syncHaremSeats）
    harem:{empress:null,huangGuifei:null},
    haremNpcs:{}, // 动态后宫嫔妃（下方 genHaremNpcs 填充）
    nwu:{month:0,stock:[]},
    bribe:{month:0,count:0},
    passToken:null,   // 出宫令牌：到期月份索引(year*12+month)，null 表示无
    bank:0,           // 钱庄存款银两（存银票，规避抄家损失，月月生息）
    lastServiced:null,
    nobleTitle:0,
    log:[],
  };
  // 对齐兜底名
  g.c.name=validateName(draft.name).ok?draft.name:'无名氏';
  // 初始化NPC好感：朝臣 + 太后 + 动态后宫嫔妃
  CFG.ministers.forEach(m=>g.ministers[m[0]]=0);
  g.consorts.cnp_dowager=30;
  g.haremNpcs=genHaremNpcs(g);
  Object.keys(g.haremNpcs).forEach(id=>g.consorts[id]=20);
  syncHaremSeats(g); // 依据初始后宫位份设置皇后/皇贵妃席位
  CFG.servantTpl[route].forEach(t=>g.c.servants.push({id:t[0],name:t[1],desc:t[2],loyalty:70,ability:20}));
  if(route==='CONSORT')seedConsortChildren(g);
  addLog(g,'出身'+CFG.familyInfo[draft.family].name+'，'+familyDesc(draft)+'，入宫授「'+CFG.ranks[route].find(r=>r[0]===g.c.rank)[1]+'」之位。');
  return g;
}
function addLog(g,text){g.log.unshift({y:g.time.year,m:g.time.month,t:text});if(g.log.length>40)g.log.pop()}

/* 存档读写 */
function saveToSlot(n){
  if(!S.game)return;
  localStorage.setItem(SLOT_KEY(n),JSON.stringify({ts:Date.now(),data:S.game}));
  localStorage.setItem(AUTO_KEY,JSON.stringify({ts:Date.now(),data:S.game}));

/* 存档兼容：老档补齐新增字段 */
function migrate(g){
  if(!g||!g.c)return g;
  const c=g.c;
  if(!Array.isArray(c.servants))c.servants=Array.isArray(g.servants)?g.servants:[];
  if(!Array.isArray(g.children))g.children=[];
  g.children.forEach(k=>{if(!k.uid)k.uid=childUid();if(k.isMine===undefined)k.isMine=(!k.mother&&k.birthMother===c.name);if(!k.motherName)k.motherName=k.birthMother||'后宫妃嫔';if(k.adopted===undefined)k.adopted=false;if(k.heir===undefined)k.heir=null});
  autoSchoolOthers(g); // 老档补齐：他妃所出满六岁自动入上书房
  if(!Array.isArray(g.dutyCompleted))g.dutyCompleted=[];
  if(!g.inventory)g.inventory={};
  if(g.pregnant===undefined)g.pregnant=null;
  if(!c.attributes.fertility&&c.attributes.fertility!==0)c.attributes.fertility=50;
  if(!g.emperor)g.emperor={health:82,mood:50};
  if(!g.emperor.persona)g.emperor.persona='scheming';
  if(!g.emperor.surname||!g.emperor.given||!g.emperor.name){const nm=genEmperorName();g.emperor.surname=nm.surname;g.emperor.given=nm.given;g.emperor.name=nm.full;}
  // 皇帝寿限/继位字段（老档补齐）
  if(typeof g.emperor.age!=='number')g.emperor.age=CFG.emperor.age;
  if(typeof g.emperor.deathAge!=='number')g.emperor.deathAge=rnd(CFG.emperorLife.deathMin,CFG.emperorLife.deathMax);
  if(g.emperor.alive===undefined)g.emperor.alive=true;
  if(g.emperor.heir===undefined)g.emperor.heir=null;
  if(typeof g.emperor.reign!=='number')g.emperor.reign=1;
  // 太后（慈宁宫）
  if(!g.dowager){const age=rnd(CFG.dowager.ageMin,CFG.dowager.ageMax);g.dowager={name:'章太后',age,deathAge:rnd(Math.min(70,age+3),CFG.dowager.deathMax),alive:true}}
  // 动态后宫：老档从静态 CFG.consorts 迁移（排除太后），保留原名字/位份
  if(!g.haremNpcs){
    const labelRank={'皇后':'HUANG_HOU','皇贵妃':'HUANG_GUI_FEI','贵妃':'GUI_FEI','妃':'FEI','嫔':'PIN','贵人':'GUI_REN','常在':'CHANG_ZAI','答应':'DA_YING'};
    const npcs={};
    CFG.consorts.filter(cn=>cn[0]!=='cnp_dowager').forEach(cn=>{
      let rank=labelRank[cn[2]]||'FEI';
      // 兼容旧标签：宠妃/丽妃/德妃→FEI，庶妃/宁嫔→PIN，低位嫔妃→CHANG_ZAI
      if(cn[2]==='宠妃'||cn[2]==='丽妃'||cn[2]==='德妃')rank='FEI';
      if(cn[2]==='庶妃'||cn[2]==='宁嫔')rank='PIN';
      if(cn[2]==='低位嫔妃')rank='CHANG_ZAI';
      npcs[cn[0]]={id:cn[0],name:cn[1],rank,age:rnd(18,30),constitution:rnd(60,90),alive:true,desc:cn[3]};
    });
    g.haremNpcs=npcs;
  }
  // 后宫顶层席位（依据动态位份同步，主控占位优先）
  if(!g.harem)g.harem={empress:null,huangGuifei:null};
  syncHaremSeats(g);
  if(c.isDowager===undefined)c.isDowager=false;
  if(c.inColdUntil===undefined)c.inColdUntil=0;
  // 皇嗣冠皇帝姓：统一以皇帝姓氏为准（幂等）
  g.children.forEach(k=>{
    if(!k.given)k.given=(typeof k.name==='string'?k.name.replace(/[男女]$/,''):'昭')||'昭';
    k.surname=g.emperor.surname;
    k.name=k.surname+k.given;
  });
  if(!g.nwu)g.nwu={month:0,stock:[]};
  if(!g.bribe)g.bribe={month:0,count:0};
  if(g.passToken===undefined)g.passToken=null;
  if(typeof g.bank!=='number')g.bank=0;
  if(g.lastServiced===undefined)g.lastServiced=null;
  if(g.nobleTitle===undefined)g.nobleTitle=0;
  if(typeof c.married!=='boolean')c.married=false;
  if(!c.husband)c.husband=null;
  if(!c.debuffs)c.debuffs=[];
  if(!c.origin)c.origin=rollOrigin(c.family||'COMMONER');
  if(!g.consorts)g.consorts={};
  if(g.consorts.cnp_dowager===undefined)g.consorts.cnp_dowager=30;
  Object.keys(g.haremNpcs).forEach(id=>{if(g.consorts[id]===undefined)g.consorts[id]=20});
  if(!g.lastJingren)g.lastJingren=null;
  if(!g.ending)g.ending=null;
  if(!g.log)g.log=[];
  return g;
}
function loadSlot(n){try{const raw=localStorage.getItem(SLOT_KEY(n));return raw?migrate(JSON.parse(raw)):null}catch(e){return null}}
function loadAuto(){try{const raw=localStorage.getItem(AUTO_KEY);return raw?migrate(JSON.parse(raw)):null}catch(e){return null}}
function hasAnySave(){for(let i=1;i<=3;i++)if(loadSlot(i))return true;return !!loadAuto()}
function latestSave(){
  let best=null;for(let i=1;i<=3;i++){const s=loadSlot(i);if(s&&(!best||s.ts>best.ts))best={...s,slot:i}}
  const a=loadAuto();if(a&&(!best||a.ts>best.ts))best={...a,slot:'auto'};return best;
}

/* ---------- 4. 通用工具 ---------- */
function toast(msg){
  document.querySelectorAll('.toast').forEach(e=>e.remove());
  const d=document.createElement('div');d.className='toast';d.textContent=msg;
  document.getElementById('app').appendChild(d);
  clearTimeout(S.toastTimer);S.toastTimer=setTimeout(()=>d.remove(),1900);
}
function emperorPersona(){
  const key=S.game&&S.game.emperor&&S.game.emperor.persona;
  return CFG.emperor.personas.find(p=>p.key===key)||CFG.emperor.personas[3];
}
function rankName(){const c=S.game.c;if(c.isDowager)return '皇太后';return CFG.ranks[c.route].find(r=>r[0]===c.rank)[1]}
function rankIdx(){const c=S.game.c;return CFG.ranks[c.route].findIndex(r=>r[0]===c.rank)}
/* 收嗣门槛：妃嫔线且位份达「嫔」（索引4）及以上 */
function canAdopt(){const c=S.game.c;if(c.route!=='CONSORT')return false;const pi=CFG.ranks.CONSORT.findIndex(r=>r[0]==='PIN');return rankIdx()>=pi}
/* 收嗣·生母条件：生母已离世 / 在冷宫 / 位份≤贵人，方可领养其皇嗣 */
function adoptMotherEligible(k){
  const g=S.game,mid=k&&k.mother;
  if(!mid)return {ok:true,reason:''}; // 无生母记录（亲生/孤档）不限制
  const npc=(g.haremNpcs||{})[mid];
  if(!npc||!npc.alive)return {ok:true,reason:'生母已离世'};
  if(npc.inCold)return {ok:true,reason:'生母已被废黜、幽居冷宫'};
  const ri=CFG.ranks.CONSORT.findIndex(r=>r[0]===npc.rank);
  const guiIdx=CFG.ranks.CONSORT.findIndex(r=>r[0]==='GUI_REN');
  if(ri>=0&&ri<=guiIdx)return {ok:true,reason:'生母位份仅在贵人及以下'};
  return {ok:false,reason:'生母'+npc.name+'位份为'+npcRankLabel(npc)+'，需其离世、入冷宫或位份≤贵人方可收嗣'};
}
function canAdoptChild(k){
  if(!canAdopt())return {ok:false,reason:'需位份达「嫔」及以上方可收嗣'};
  return adoptMotherEligible(k);
}
function salary(){const c=S.game.c;return CFG.salary[c.route][rankIdx()]||0}
/* 晋升攻略：返回当前路线下一级的达成条件与进度 */
/* 姿才：容貌+才情，妃嫔晋升门槛 */
function looksNeed(nextRank){return CFG.looksReq[nextRank]||0}
function looksSum(c){return (c.attributes.appearance||0)+(c.attributes.talent||0)}
function promoteReq(){
  const c=S.game.c,rs=CFG.ranks[c.route],ri=rankIdx();
  if(ri>=rs.length-1)return {max:true};
  const n=rs[ri+1],r={name:n[1],need:'',cur:'',progress:0,parts:[]};
  if(c.route==='CONSORT'){
    const raw=n[2]||0,relief=Math.min(c.favor*0.5,raw*0.7),need=Math.max(raw*0.3,raw-relief),fav=n[3]||0;
    r.parts=[{k:'威望',cur:c.prestige,need:Math.ceil(need)},{k:'帝宠',cur:c.favor,need:fav}];
    const lk=looksNeed(n[0]);
    if(lk)r.parts.push({k:'姿才',cur:looksSum(c),need:lk});
    const st=SEAT_OF[n[0]];
    if(st)r.parts.push({k:seatLabel(n[0])+'位',cur:seatBlocked(st)?0:1,need:1,text:seatLabel(n[0])+'位空出'});
  } else if(c.route==='MAID'){
    r.parts=[{k:'勤谨',cur:c.diligence,need:n[2]}];
  } else {
    r.parts=[{k:'功勋',cur:c.merit,need:n[2]},{k:'声望',cur:c.reputation,need:n[3]}];
  }
  r.need=r.parts.map(p=>p.text||(p.k+'≥'+p.need)).join(' 且 ');
  r.cur=r.parts.map(p=>p.text?(p.k+(p.cur?'·已空':'·被占')):(p.k+' '+p.cur+'/'+p.need)).join(' · ');
  const ratio=r.parts.reduce((a,p)=>a+Math.min(1,p.cur/p.need),0)/r.parts.length;
  r.progress=Math.round(ratio*100);
  r.ok=r.parts.every(p=>p.cur>=p.need);
  return r;
}
function favorStage(v){for(const [n,l] of CFG.favorStage)if(v>=n)return l;return '陌生'}
function affStage(v){for(const [n,l] of CFG.stages)if(v>=n)return l;return '陌生'}
function esc(s){return String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}

/* 数值结算（扣AP、跨月、自动俸禄、每月剧情、死亡判定） */
function spendAP(n){
  if(S.game.ending)return;
  S.game.time.ap=Math.max(0,S.game.time.ap-n);
}
/* 手动进入下一月：结算俸禄 + 随机事件，由玩家主动触发 */
function advanceMonth(){
  if(S.game.ending)return;
  if(S.modal||S.flow){toast('请先结束当前事件');return}
  const r=nextMonth();
  render();
  if(r!=='death')toast('进入第 '+S.game.time.year+' 年 · 第 '+S.game.time.month+' 月');
}
/* 死亡结局 */
function setEnding(type){
  const g=S.game;
  g.ending={type};
  S.pendingFlows=[];S.flow=null;S.modal=null;S.screen='ending';
  addLog(g,DEATH_ENDINGS[type].sub+'，故事落幕。');
  toast(DEATH_ENDINGS[type].title);
  autoSave();render();
}
function checkDeath(){
  if(S.game.ending)return true;
  if(S.game.c.attributes.constitution<=0){setEnding('illness');return true}
  return false;
}
function revive(){
  const g=S.game,type=g.ending&&g.ending.type,c=g.c;
  if(!type)return;
  if(type==='illness'){
    c.attributes.constitution=30;
    addLog(g,'命悬一线之际，幸得神医相救，体质渐复。');
  }else{
    c.attributes.constitution=Math.max(20,c.attributes.constitution);
    c.prestige=Math.max(0,c.prestige-20);
    c.silver=Math.max(0,c.silver-30);
    addLog(g,'贵人求情，赐死改为幽禁，保全性命（威望-20、银两-30）。');
  }
  g.ending=null;S.screen='main';S.modal=null;S.flow=null;S.pendingFlows=[];
  autoSave();render();toast('[原型] 广告已看完，死里逃生');
}
function restartGame(){
  S.screen='title';S.game=null;S.modal=null;S.flow=null;S.pendingFlows=[];render();
}
function nextMonth(){
  const t=S.game.time;
  const coldBefore=isInCold(S.game);
  t.ap=CFG.actionMax;t.month++;
  let yearEnd=false;
  if(coldBefore&&!isInCold(S.game)){
    S.game.c.inColdUntil=0;
    addLog(S.game,'冷宫期满，你得以重返宫中。');
    S.pendingFlows.push({stage:'result',title:'冷宫期满',
      resultText:'幽禁岁月终告结束，你重整衣冠，走出了冷宫。往后的路，更需步步谨慎。',
      deltas:[],promoted:null,yearEnd:false});
  }
  if(t.month>CFG.monthsPerYear){
    t.month=1;t.year++;yearEnd=true;
    S.game.c.silver+=CFG.annualSilverBonus;
    S.game.c.age=(S.game.c.age||0)+1;
    for(const k in S.game.c.attributes)S.game.c.attributes[k]=Math.min(100,S.game.c.attributes[k]+rnd(1,3));
    addLog(S.game,'岁末年初，朝廷例赏银 '+CFG.annualSilverBonus+' 两，全属性略有精进；你长了一岁，现年 '+S.game.c.age+' 岁。');
    // 后宫嫔妃年岁增长
    liveConsorts(S.game).forEach(n=>{n.age=(n.age||0)+1});
    // 太后与皇帝年岁推进（驾崩判定）
    dowagerTick(S.game,true);
    emperorTick(S.game,true);
  }
  // 俸禄每月自动发放，无需再去库房领取
  let pay=salary();
  if(S.game.c.married){pay+=12;addLog(S.game,'夫君接济，另有银两 12 两。');}
  S.game.c.silver+=pay;
  addLog(S.game,'新的一月，自动领俸禄 '+pay+' 两。');
  // 钱庄存款利息：每月按 5% 计息，银票存于钱庄可规避抄家损失
  if(S.game.bank>0){
    const interest=Math.floor(S.game.bank*0.05);
    if(interest>0){S.game.bank+=interest;addLog(S.game,'钱庄银票生息，存款利息 +'+interest+' 两（现有 '+S.game.bank+' 两）。')}
  }
  // 怀孕推进
  if(S.game.pregnant){
    S.game.pregnant.months--;
    if(S.game.pregnant.months<=0){
      const rn=royalName(S.game);const gender=rn.gender;
      const name=rn.name;
      const lowRank=rankIdx()<=2; // 官女子/答应/常在
      const highRank=liveConsorts(S.game).filter(n=>['FEI','GUI_FEI','HUANG_GUI_FEI','HUANG_HOU'].indexOf(n.rank)>=0);
      const foster=lowRank&&highRank.length?pick(highRank).name:null;
      S.game.children.push({uid:childUid(),name,given:rn.given,surname:rn.surname,gender,age:0,fosterBy:foster,birthMother:S.game.c.name,isMine:true,mother:null,motherName:S.game.c.name});
      S.game.pregnant=null;
      const fosterText=foster?'。你位份尚低，此子交由「'+foster+'」抚养，日后仍可探望':'，由你亲自抚养';
      addLog(S.game,'诞下'+gender+'婴，取名「'+name+'」'+fosterText+'。');
      const deltas=[{t:'子嗣 +1 · '+name,pos:true,k:'aff'}];
      if(foster)deltas.push({t:'交由'+foster+'抚养',pos:false,k:'res'});
      S.pendingFlows.push({stage:'result',title:'喜得子嗣',
        resultText:'十月怀胎，一朝分娩，'+gender+'婴呱呱坠地，取名「'+name+'」'+fosterText+'。',
        deltas,promoted:null,yearEnd:false});
    }
  }
  // 后宫子嗣年龄推进 + 嫔妃诞育
  monthlyChildren(S.game);
  // 其他嫔妃：年龄衰减/病故/随机死亡、每6个月自主晋位、每3年选秀
  npcAgingTick(S.game);
  npcPromoteTick(S.game);
  selectionTick(S.game);
  syncHaremSeats(S.game); // 席位与存活 NPC 位份对齐（主控占位优先）
  // 每月侍寝公告：随机一位妃嫔承恩
  if(S.game.c.route==='CONSORT'){
    const pool=liveConsorts(S.game).filter(n=>n.rank!=='HUANG_HOU').map(n=>[n.id,n.name]);
    if(pool.length){
    const chosen=pick(pool);
    S.game.lastServiced=chosen[1];
    addLog(S.game,'本月侍寝：'+chosen[1]+'承恩侍寝。');
    S.pendingFlows.push({stage:'result',title:'本月侍寝',
      resultText:'宫中传出消息，本月承恩侍寝的是「'+chosen[1]+'」。'+(S.game.c.name===chosen[1]?'（这正是你）':''),
      deltas:[{t:'本月侍寝 · '+chosen[1],pos:true,k:'aff'}],promoted:null,yearEnd:false});
    }
  }
  // 后宫顶层席位失势：皇后/皇贵妃有概率被废或病故，空出位子
  handleHaremVacancy(S.game);
  // 太后懿旨：好感达标 + 主控低位，概率破格晋封
  dowagerEdictTick(S.game);
  // 年龄衰减：主控年龄大于35每月掉1-2体质，大于45掉3-5体质
  const cAge=S.game.c.age||0,dc=CFG.ageDecay;
  let ageLoss=0;
  if(cAge>dc.severe)ageLoss=rnd(dc.severeLoss[0],dc.severeLoss[1]);
  else if(cAge>dc.warn)ageLoss=rnd(dc.warnLoss[0],dc.warnLoss[1]);
  if(ageLoss>0){
    const before=S.game.c.attributes.constitution;
    S.game.c.attributes.constitution=Math.max(0,before-ageLoss);
    const actual=before-S.game.c.attributes.constitution;
    if(actual>0){
      addLog(S.game,'年岁渐长（'+cAge+'岁），体质自然衰退 -'+actual+'。');
      S.pendingFlows.push({stage:'result',title:'年岁渐长',
        resultText:'岁月不饶人，你 '+cAge+' 岁的身子已不比当年，体质略有衰退。'+(cAge>dc.severe?'（年过四十五，衰退更速）':''),
        deltas:[{t:'体质 -'+actual+'（年岁）',pos:false,k:'attr'}],promoted:null,yearEnd:false});
    }
  }
  // 心智陷害：心智低于50，每月有概率被其他嫔妃陷害
  const fr=CFG.frame;
  const framePool=liveConsorts(S.game).filter(n=>n.rank!=='HUANG_HOU').map(n=>[n.id,n.name]);
  if(S.game.c.route==='CONSORT'&&framePool.length&&(S.game.c.attributes.wit||0)<fr.witBelow&&Math.random()<fr.prob){
    const npc=pick(framePool);
    const fd=applyEffects({prestige:fr.prestige,constitution:fr.constitution,favor:fr.favor},{[npc[0]]:fr.npcFavor});
    addLog(S.game,'因心智不足，遭'+npc[1]+'构陷中伤，威望与圣眷受损。');
    S.pendingFlows.push({stage:'result',title:'遭人构陷',
      resultText:'你心思单纯、识人不明，'+npc[1]+'抓住破绽，在宫中散布流言、暗中使绊。你一时百口莫辩，威望与圣眷俱损，与她的关系也降至冰点。',
      deltas:fd,promoted:null,yearEnd:false});
  }
  // 每月开头自动触发宫廷突发剧情
  let ev=pick(MONTHLY_EVENTS[S.game.c.route]||[]);
  if(Math.random()<0.4||!ev)ev=pick(MONTHLY_EVENTS.ALL);
  if(EXECUTION_EVENT.cond(S.game)&&Math.random()<0.22)ev=EXECUTION_EVENT;
  if(ev===EXECUTION_EVENT){setEnding('execution');return 'death'}
  const deltas=applyEffects(ev.e||{},ev.a||{});
  addLog(S.game,'【'+ev.t+'】'+ev.x);
  if(checkDeath())return 'death';
  S.pendingFlows.push({stage:'result',title:ev.t,
    resultText:ev.x+'（本月自动剧情，属性已结清）',deltas,promoted:null,yearEnd});
  autoSave();
  return yearEnd?'yearEnd':'month';
}
/* ===== 后宫席位 / 太后 / 储君 / 改朝换代 核心逻辑 ===== */
const SEAT_OF={HUANG_HOU:'empress',HUANG_GUI_FEI:'huangGuifei'};
function seatHolder(rankKey){return (S.game.harem&&S.game.harem[rankKey])||null}
function seatBlocked(rankKey){const h=seatHolder(rankKey);return !!h&&h!=='PLAYER'}
function occupySeat(rankKey,who){if(!S.game.harem)S.game.harem={};S.game.harem[rankKey]=who||'PLAYER'}
function releaseSeat(rankKey){if(S.game.harem)S.game.harem[rankKey]=null}
function seatLabel(rankKey){return rankKey==='HUANG_HOU'?'皇后':'皇贵妃'}
/* 依据动态后宫 NPC 位份同步皇后/皇贵妃席位占用（主控占用优先保留） */
function syncHaremSeats(g){
  if(!g.harem)g.harem={empress:null,huangGuifei:null};
  const npcs=g.haremNpcs||{};
  for(const [rk,seat] of [['HUANG_HOU','empress'],['HUANG_GUI_FEI','huangGuifei']]){
    if(g.harem[seat]==='PLAYER')continue; // 主控（含皇太后）占位不动
    const holder=Object.values(npcs).find(n=>n.alive&&n.rank===rk);
    g.harem[seat]=holder?holder.id:null;
  }
}
/* 存活后宫 NPC 数组 */
function liveConsorts(g){return Object.values(g.haremNpcs||{}).filter(n=>n.alive)}
/* NPC 位份中文名 */
function npcRankLabel(n){const r=(CFG.ranks.CONSORT||[]).find(x=>x[0]===n.rank);return r?r[1]:'嫔妃'}
/* 主控是否可受太后懿旨破格晋升：妃嫔≤贵人；女官≤司佐 */
function edictEligible(c){
  if(c.route==='CONSORT'){const i=CFG.ranks.CONSORT.findIndex(r=>r[0]===c.rank);return i>=0&&i<=3}
  if(c.route==='OFFICIAL'){const i=CFG.ranks.OFFICIAL.findIndex(r=>r[0]===c.rank);return i>=0&&i<=3}
  return false;
}
function canDowagerEdict(g){
  const d=g.dowager;
  if(!d||!d.alive)return false;
  if((g.consorts.cnp_dowager||0)<CFG.dowager.favorNeed)return false;
  return edictEligible(g.c);
}
/* 求立储君成功率：位份越高越易成功 */
function heirSuccessRate(c){
  const ri=Math.max(0,rankIdx());
  return Math.min(CFG.heir.maxProb,CFG.heir.baseProb+ri*CFG.heir.perRank);
}
function eligibleHeirs(g){return (g.children||[]).filter(k=>(k.age||0)>CFG.heir.minAge)}
/* 主控成为皇太后 */
function becomeDowager(g,newEmperorName){
  const c=g.c;
  if(c.isDowager)return;
  c.isDowager=true;
  // 皇太后位同中宫之尊：抬至皇后位份并占用席位，寝宫/定额按最高档
  if(c.route==='CONSORT'){c.rank='HUANG_HOU';occupySeat('empress','PLAYER')}
  addLog(g,'新帝'+newEmperorName+'继位，你作为帝王骨肉至亲，晋封皇太后，位极后宫。');
}
/* 皇帝驾崩 → 新帝继位（在跨月中调用，结果推入待播剧情） */
function handleEmperorDeath(g){
  const em=g.emperor;
  em.alive=false;
  const heirs=(g.children||[]);
  let successor=null,how='';
  if(em.heir){successor=heirs.find(k=>k.uid===em.heir);if(successor)how='储君奉遗诏继位';}
  if(!successor){
    const adults=heirs.filter(k=>(k.age||0)>CFG.heir.minAge);
    const pool=adults.length?adults:heirs;
    if(pool.length){successor=pool.slice().sort((a,b)=>(b.age||0)-(a.age||0))[0];how='朝中无储君，诸王夺嫡，'+successor.name+'胜出继位';}
  }
  const oldName=em.name;
  let detail='';
  if(successor){
    em.name=successor.name;em.surname=successor.surname;em.given=successor.given;
    em.age=Math.max(16,successor.age||16);
    em.health=82;em.mood=55;em.persona=pick(CFG.emperor.personas).key;
    em.deathAge=Math.min(CFG.emperorLife.deathMax,Math.max(em.age+3,rnd(CFG.emperorLife.deathMin,CFG.emperorLife.deathMax)));
    em.heir=null;em.reign=(em.reign||1)+1;
    detail=how+'，是为新帝 '+em.name+'。';
    const isMine=successor.isMine||successor.adopted;
    if(g.c.route==='CONSORT'&&isMine&&!g.c.isDowager){
      becomeDowager(g,em.name);
      detail+='新帝乃你亲生或领养的骨肉，你晋封皇太后，位极后宫。';
    }
  }else{
    const nm=genEmperorName();
    em.name=nm.full;em.surname=nm.surname;em.given=nm.given;
    em.age=rnd(18,35);em.health=82;em.mood=55;em.persona=pick(CFG.emperor.personas).key;
    em.deathAge=rnd(CFG.emperorLife.deathMin,CFG.emperorLife.deathMax);
    em.heir=null;em.reign=(em.reign||1)+1;
    detail='皇嗣无人，宗室子弟 '+em.name+' 入承大统，是为新帝。';
  }
  em.alive=true; // 新帝继位，重塑在世状态
  addLog(g,'先帝'+oldName+'龙驭上宾。'+detail);
  S.pendingFlows.push({stage:'result',title:'龙驭上宾 · 新帝继位',
    resultText:'先帝'+oldName+'驾崩，朝野举哀。'+detail+'（今上 '+em.name+'，年 '+em.age+' 岁）',
    deltas:[{t:'改元 · 新帝 '+em.name,pos:true,k:'aff'}],promoted:null,yearEnd:false});
}
/* 皇后/皇贵妃失势：被废或病故，释放席位 */
function handleHaremVacancy(g){
  if(!g.harem)return;
  [['empress','皇后'],['huangGuifei','皇贵妃']].forEach(([seat,label])=>{
    const h=g.harem[seat];
    if(h&&h!=='PLAYER'&&Math.random()<CFG.harem.deposeProb){
      const died=Math.random()<0.5;
      g.harem[seat]=null;
      const nm=npcName(h);
      const txt=died?label+nm+'染疾薨逝':label+nm+'因故被废，幽居冷宫';
      addLog(g,txt+'，'+label+'之位空出。');
      S.pendingFlows.push({stage:'result',title:label+'位空悬',
        resultText:txt+'。'+label+'之位如今空悬，若你条件足够，或可取而代之。',
        deltas:[],promoted:null,yearEnd:false});
      // 同步动态 NPC：病故则标记死亡，被废则降为贵人并幽禁冷宫
      const npc=g.haremNpcs[h];
      if(npc){if(died)npc.alive=false;else {npc.rank='GUI_REN';npc.inCold=true}}
    }
  });
}
/* NPC 死亡：标记死亡并释放其占用的席位 */
function npcDie(g,npc,cause){
  if(!npc||!npc.alive)return;
  npc.alive=false;
  const seat=SEAT_OF[npc.rank];
  if(seat&&g.harem&&g.harem[seat]===npc.id)g.harem[seat]=null;
  addLog(g,npc.name+cause+'，享年 '+npc.age+' 岁。');
  S.pendingFlows.push({stage:'result',title:'后宫讣闻',
    resultText:'宫中传来消息，'+npc.name+cause+'，享年 '+npc.age+' 岁。'+(seat?'其位份由是空出。':'宫中上下为之叹息。'),
    deltas:[],promoted:null,yearEnd:false});
}
/* 其他嫔妃每月年龄衰减（体质）与随机死亡 */
function npcAgingTick(g){
  const dc=CFG.ageDecay;
  liveConsorts(g).forEach(n=>{
    let loss=0;
    if(n.age>dc.severe)loss=rnd(dc.severeLoss[0],dc.severeLoss[1]);
    else if(n.age>dc.warn)loss=rnd(dc.warnLoss[0],dc.warnLoss[1]);
    if(loss>0)n.constitution=Math.max(0,n.constitution-loss);
  });
  // 体质耗尽病故
  liveConsorts(g).slice().forEach(n=>{if(n.constitution<=0)npcDie(g,n,'染疾久病不治');});
  // 随机死亡事件
  liveConsorts(g).slice().forEach(n=>{
    if(n.alive&&Math.random()<CFG.npcDeathProb){
      const cause=pick(['突染急症薨逝','意外落水薨逝','卷入宫变罹难']);
      npcDie(g,n,cause);
    }
  });
}
/* 其他嫔妃每6个月随机选2位自主晋位（尊重皇后/皇贵妃席位唯一） */
function npcPromoteTick(g){
  const every=CFG.npcPromote.everyMonths;
  if(g.time.month%every!==0)return;
  const alive=liveConsorts(g).filter(n=>n.id!==g.harem.empress&&n.id!==g.harem.huangGuifei);
  const cnt=Math.min(CFG.npcPromote.count,alive.length);
  const chosen=alive.slice().sort(()=>Math.random()-0.5).slice(0,cnt);
  chosen.forEach(n=>{
    const rs=CFG.ranks.CONSORT,ri=rs.findIndex(r=>r[0]===n.rank);
    if(ri<0||ri>=rs.length-1)return;
    const next=rs[ri+1],seat=SEAT_OF[next[0]];
    if(seat&&seatBlocked(seat))return; // 顶层席位被占则跳过
    n.rank=next[0];
    if(seat)occupySeat(seat,n.id);
    addLog(g,n.name+'晋位为「'+next[1]+'」。');
    S.pendingFlows.push({stage:'result',title:'后宫晋位',
      resultText:'宫中传报，'+n.name+'晋位为「'+next[1]+'」。后宫格局又生变化。',
      deltas:[],promoted:null,yearEnd:false});
  });
}
/* 每3年选秀：1~2位新人入宫（位份贵人及以下） */
function selectionTick(g){
  const t=g.time,cfg=CFG.selection;
  if(t.year%cfg.everyYears!==0||t.month!==1)return;
  const n=rnd(cfg.min,cfg.max);
  const used={};Object.values(g.haremNpcs).forEach(x=>used[x.name]=1);
  const newcomers=[];
  for(let i=0;i<n;i++){
    const id='cnp_s'+t.year+'_'+i;
    const name=genConsortName(g,used);
    const rank=pick(cfg.ranks);
    g.haremNpcs[id]={id,name,rank,age:rnd(15,20),constitution:rnd(70,92),alive:true,inCold:false,
      desc:pick(CFG.haremNpc.descs),isNew:true};
    g.consorts[id]=20;
    newcomers.push(name+'（'+npcRankLabel({rank})+ '）');
  }
  addLog(g,'三年一度选秀，'+newcomers.join('、')+'入宫。');
  S.pendingFlows.push({stage:'result',title:'选秀入宫',
    resultText:'三年一度的选秀落下帷幕，'+newcomers.join('、')+'入宫，位份皆在贵人以下。后宫又添新颜。',
    deltas:[],promoted:null,yearEnd:false});
}
/* 太后每年长一岁，至驾崩年龄薨逝，慈宁宫封闭 */
function dowagerTick(g,yearEnd){
  const d=g.dowager;if(!d||!d.alive||!yearEnd)return;
  d.age++;
  if(d.age>=d.deathAge){
    d.alive=false;
    addLog(g,'太后'+d.name+'薨逝，享年 '+d.age+' 岁。慈宁宫自此封闭。');
    S.pendingFlows.push({stage:'result',title:'太后薨逝',
      resultText:'慈宁宫传来噩耗，太后'+d.name+'驾崩，享年 '+d.age+' 岁。宫中举哀，慈宁宫自此谢绝觐见。',
      deltas:[],promoted:null,yearEnd:false});
  }
}
/* 太后懿旨：好感≥80 + 主控低位，概率破格晋升一级 */
function dowagerEdictTick(g){
  if(!canDowagerEdict(g))return;
  if(Math.random()>=CFG.dowager.edictProb)return;
  const c=g.c,rs=CFG.ranks[c.route],ri=rankIdx();
  if(ri>=rs.length-1)return;
  const next=rs[ri+1],seat=SEAT_OF[next[0]];
  if(seat&&seatBlocked(seat))return;
  c.rank=next[0];if(seat)occupySeat(seat,'PLAYER');
  addLog(g,'太后下懿旨，破格晋封你为「'+next[1]+'」。');
  S.pendingFlows.push({stage:'result',title:'太后懿旨 · 破格晋封',
    resultText:'太后召你入慈宁宫，温言嘉许，当即便下懿旨：「'+c.name+' 才德兼备，破格晋封为'+next[1]+'。」此乃天大恩荣。',
    deltas:[{t:'破格晋封 · '+next[1],pos:true,k:'aff'}],promoted:next[1],yearEnd:false});
}
/* 皇帝每年长一岁，至驾崩年龄龙驭上宾 */
function emperorTick(g,yearEnd){
  const em=g.emperor;if(!em||!em.alive||!yearEnd)return;
  em.age++;
  if(em.age>=em.deathAge)handleEmperorDeath(g);
}
function tryPromote(){
  const c=S.game.c,ri=rankIdx(),rs=CFG.ranks[c.route];
  if(ri>=rs.length-1)return null;
  const next=rs[ri+1];
  // 顶层席位被占（皇后/皇贵妃）则无法晋升；皇太后为顶点不再晋升
  const seat=SEAT_OF[next[0]];
  if(seat&&seatBlocked(seat))return null;
  let ok=false;
  if(c.route==='CONSORT'){
    const relief=Math.min(c.favor*0.5, (next[2]||0)*0.7);
    const need=Math.max((next[2]||0)*0.3,(next[2]||0)-relief);
    const lk=looksNeed(next[0]);
    ok=c.prestige>=need&&c.favor>=(next[3]||0)&&looksSum(c)>=lk;
  } else if(c.route==='MAID') ok=c.diligence>=next[2];
  else ok=c.merit>=next[2]&&c.reputation>=next[3];
  if(ok){c.rank=next[0];if(seat)occupySeat(seat,'PLAYER');addLog(S.game,'晋升为「'+next[1]+'」！');autoSave();return next[1]}
  return null;
}
function npcName(id){
  if(id==='cnp_dowager'){const d=S.game&&S.game.dowager;return d&&d.name?d.name:'章太后'}
  const npc=S.game&&S.game.haremNpcs&&S.game.haremNpcs[id];
  if(npc&&npc.name)return npc.name;
  const isMin=id.startsWith('min');
  const arr=isMin?CFG.ministers:CFG.consorts;
  const f=arr.find(n=>n[0]===id);return f?f[1]:id;
}
function applyEffects(e,a){
  const c=S.game.c,out=[];
  const map={silver:'银两',prestige:'威望',favor:'帝宠',diligence:'勤谨',merit:'功勋',reputation:'声望'};
  const attrName=CFG.attrName;
  // 属性类 key 无论写在顶层还是 attributes 里，一律进属性面板并用中文显示
  const addAttr=(k,v)=>{
    if(!attrName[k])return false;
    c.attributes[k]=Math.max(0,Math.min(100,(c.attributes[k]||0)+v));
    out.push({t:attrName[k]+' '+(v>0?'+':'')+v,pos:v>0,k:'attr'});
    return true;
  };
  for(const k in e){if(k==='attributes')continue;const v=e[k];if(!v)continue;
    if(!addAttr(k,v)){
      c[k]=Math.max(0,(c[k]||0)+v);
      out.push({t:(map[k]||k)+' '+(v>0?'+':'')+v,pos:v>0,k:'res'});
    }}
  if(e.attributes)for(const k in e.attributes){const v=e.attributes[k];if(v)addAttr(k,v);}
  if(a)for(const key in a){let id=key;const v=a[key];if(!v)continue;
    // 事件里写死的旧 consort ID（如 cnp_fei）在当前动态后宫不存在时，映射到一位随机存活嫔妃
    if(id.startsWith('cnp_')&&id!=='cnp_dowager'&&!S.game.haremNpcs[id]){
      const alive=liveConsorts(S.game);
      if(alive.length)id=pick(alive).id;
    }
    const store=id.startsWith('min')?S.game.ministers:S.game.consorts;
    const cur=store[id]||0;store[id]=Math.max(0,Math.min(100,cur+v));
    out.push({t:npcName(id)+'好感 '+(v>0?'+':'')+v,pos:v>0,k:'aff'});}
  return out;
}

/* ---------- 5. 渲染框架 ---------- */
const app=document.getElementById('app');
function render(){
  // 跨月产生的自动剧情排队，等当前弹窗关闭后依次弹出
  if((S.screen==='main'||S.screen==='outside')&&!S.modal&&!S.flow&&S.pendingFlows&&S.pendingFlows.length){
    S.flow=S.pendingFlows.shift();S.modal='event';
  }
  app.innerHTML=view();bind();
}
function view(){
  switch(S.screen){
    case 'title':return vTitle();
    case 'route':return vRoute();
    case 'create':return vCreate();
    case 'main':return vMain()+ (S.modal?modalHTML():'');
    case 'outside':return vOutside()+ (S.modal?modalHTML():'');
    case 'ending':return vEnding();
  }
  return '';
}
function bind(){
  app.querySelectorAll('[data-a]').forEach(el=>el.addEventListener('click',e=>{
    const a=el.dataset.a,p=el.dataset.p;
    handle(a,p,e);
  }));
}

/* 统一流程返回：支持宫外地图/私邸/宫门等特殊返回目标 */
function flowBack(){
  const back=(S.flow&&S.flow.backTo)||null;
  S.flow=null;
  if(back==='outside'){S.screen='outside';S.modal=null}
  else if(back==='mansionBack'){S.modal='mansion'}
  else if(back==='gate'){S.modal='gate'}
  else S.modal=back;
  render();
}
/* ---------- 6. 交互处理 ---------- */
function handle(a,p,e){
  const d=S.draft;
  // 幽禁冷宫：仅放行导航/跨月/存档/对话/复活等，禁止其余主动行动
  if(S.game&&isInCold(S.game)){
    const coldAllow=['openPanel','closeModal','closeFlow','choose','nextMonth','palaceNextMonth',
      'saveSlot','loadSlot','revive','restartEnding','npcTab','locLocked','bankOp','toRoute',
      'backTitle','backRoute','continue','enterLoc','backToPalace','enterOutLoc','govGate'];
    if(coldAllow.indexOf(a)<0){toast('你正幽禁冷宫，无法行动，静待期满（可「进入下一月」）');return}
  }
  switch(a){
    case 'toRoute':S.screen='route';render();break;
    case 'backTitle':S.screen='title';render();break;
    case 'continue':{const ls=latestSave();if(ls){S.game=ls.data;S.screen=ls.data.ending?'ending':'main';S.modal=null;S.flow=null;S.pendingFlows=[];toast('已读取存档')}render();break;}
    case 'pickRoute':
      S.createRoute=p;
      S.createBureau=p==='CONSORT'?null:'SHANG_GONG';
      S.draft=newDraft();S.screen='create';render();break;
    case 'pickBureau':S.createBureau=p;render();break;
    case 'backRoute':S.screen='route';render();break;
    case 'rfFamily':
      if(d.freeFamily>0){rerollFamily(d);d.freeFamily--;syncName();render();toast('家世已刷新')}
      break;
    case 'raFamily':
      // 原型无广告SDK：模拟激励广告，仅换取一次刷新机会（不强制观看）
      d.adFamily++;d.freeFamily++;syncName();render();toast('[原型] 看完广告，家世刷新机会 +1');
      break;
    case 'rfAttr':
      if(d.freeAttr>0){rerollAttr(d);d.freeAttr--;syncName();render();toast('属性已刷新')}
      break;
    case 'raAttr':
      d.adAttr++;d.freeAttr++;syncName();render();toast('[原型] 看完广告，属性刷新机会 +1');
      break;
    case 'confirmCreate':{
      syncName();const v=validateName(S.draft.name);
      if(!v.ok){toast(v.reason);return}
      if(S.createRoute!=='CONSORT'&&!S.createBureau){toast('请选择供职六局');return}
      S.game=buildGame(d,S.createRoute,S.createBureau);
      saveToSlot(1);S.screen='main';S.modal=null;render();
      toast('入宫成功，愿你步步为营');break;
    }
    case 'openPanel':S.modal=(S.modal===p?null:p);render();break;
    case 'palaceDo':palaceDo(p);break;
    case 'palaceNextMonth':palaceNextMonth();break;
    case 'childAct':childAct(p);break;
    case 'schoolEnroll':schoolEnroll(p);break;
    case 'closeModal':flowBack();break;
    case 'enterLoc':enterLocation(p);break;
    case 'enterOutLoc':enterOutsideLoc(p);break;
    case 'leavePalace':leavePalace(p);break;
    case 'backToPalace':backToPalace();break;
    case 'buyPassToken':buyPassToken();break;
    case 'bankOp':bankOp(p);break;
    case 'mansionAct':mansionAct(p);break;
    case 'govGate':gateEncounter();break;
    case 'locLocked':toast(p);break;
    case 'emperorAct':emperorAct(p);break;
    case 'openHeir':openHeir();break;
    case 'claimHeir':claimHeir(p);break;
    case 'dowagerVisit':dowagerVisit();break;
    case 'bribeEunuch':bribeEunuch();break;
    case 'openPoison':openPoison(p);break;
    case 'selPoisonStaff':S_poisonStaff=+p;render();break;
    case 'doPoison':doPoison(p);break;
    case 'nextMonth':advanceMonth();break;
    case 'choose':chooseOption(+p);break;
    case 'closeFlow':flowBack();break;
    case 'revive':revive();break;
    case 'restartEnding':restartGame();break;
    case 'doDuty':doDuty(p);break;
    case 'saveSlot':saveToSlot(+p);render();break;
    case 'loadSlot':{const s=loadSlot(+p);if(s){S.game=s.data;S.screen=s.data.ending?'ending':'main';S.modal=null;S.flow=null;S.pendingFlows=[];render();toast('已读取存档槽 '+p)}break;}
    case 'buyItem':buyItem(p);break;
    case 'useItem':useItem(p);break;
    case 'hireStaff':hireStaff(p);break;
    case 'npcTab':S.npcTab=p;render();break;
    case 'govAct':govAct(p);break;
    case 'grantNoble':grantNoble();break;
    case 'openGift':openGift(p);break;
    case 'giftTo':giftTo(p);break;
    case 'npcAct':{const parts=p.split('|');npcAct(parts[0],parts[1]);break;}
    case 'propose':propose(p);break;
    case 'rewardServant':rewardServant(+p);break;
    case 'trainServant':trainServant(+p);break;
    case 'transit':transit(p);break;
  }
}

/* ===== 新增交互 ===== */
function buyItem(id){
  const t=itemDef(id);if(!t)return;
  if(S.game.c.silver<t[2]){toast('银两不足');return}
  S.game.c.silver-=t[2];
  S.game.inventory[t[1]]=(S.game.inventory[t[1]]||0)+1;
  addLog(S.game,'购得「'+t[1]+'」。');autoSave();render();toast('购得 '+t[1]);
}
/* 背包物品自用 */
function useItem(name){
  const g=S.game,inv=g.inventory;
  if(!inv[name]||inv[name]<=0){toast('无此物品');return}
  const t=itemDef(name);
  let deltas=[],title='',text='';
  if(t&&t[3]==='attr'){
    // 属性值：形如 "appearance:3" 或 "appearance:3,talent:2"
    const eff={};String(t[4]).split(',').forEach(p=>{const [k,v]=p.split(':');if(k&&+v)eff[k]=(eff[k]||0)+(+v)});
    deltas=applyEffects(eff,{});title='使用·'+t[1];
    text='你取用「'+t[1]+'」，细细调养一番，颇有裨益。';
  } else if(t&&t[3]==='gift'){
    // 礼物自用：按用途给小幅属性
    const selfMap={gift_rouge:{appearance:3},gift_tea:{constitution:3,wit:2},
      gift_jade:{social:3,prestige:2},gift_ink:{talent:3,wit:2}};
    const eff=selfMap[t[0]]||{social:2};
    deltas=applyEffects(eff,{});title='自用·'+t[1];
    text='你将「'+t[1]+'」留作己用，也算物尽其用。';
  } else if(t&&t[3]==='poison'){
    deltas=applyEffects({constitution:-12},{});
    deltas.push({t:'毒发 · 体质大损',pos:false,k:'attr'});
    title='误用·'+t[1];
    text='你一时糊涂服下「'+t[1]+'」，顿觉五脏如焚，幸而剂量不致命，却大伤元气。';
  } else {
    // 无定义的物品：给个通用小收益
    deltas=applyEffects({constitution:2},{});title='使用·'+name;
    text='你使用「'+esc(name)+'」，略有所得。';
  }
  inv[name]--;if(inv[name]<=0)delete inv[name];
  if(checkDeath())return;
  addLog(g,'使用物品「'+name+'」。');
  S.flow={stage:'result',title,resultText:text,deltas,promoted:null,yearEnd:false};
  S.modal='event';autoSave();render();
}
/* 常驻 NPC 互动：拜会 / 交好，各耗 1 行动力 */
function npcAct(npcId,mode){
  const gain=CFG.interact[mode]||CFG.interact.GREET;
  const store=npcId.startsWith('min')?S.game.ministers:S.game.consorts;
  if((store[npcId]||0)>=100){toast('对方好感已满');return}
  if(S.game.time.ap<1){toast('行动力不足');return}
  spendAP(1);
  store[npcId]=Math.min(100,(store[npcId]||0)+gain);
  addLog(S.game,(mode==='GREET'?'拜会':'交好')+npcName(npcId)+'，好感 +'+gain);
  autoSave();render();toast(npcName(npcId)+'好感 +'+gain);
}
let S_giftTarget=null;
function openGift(npcId){
  S_giftTarget=npcId;
  const gifts=Object.keys(S.game.inventory).filter(k=>CFG.shop.find(t=>(t[0]===k||t[1]===k)&&t[3]==='gift')&&S.game.inventory[k]>0);
  if(!gifts.length){toast('暂无礼物，请到商店购买');return}
  S.modal='gift';render();
}
function giftTo(giftName){
  if(!S_giftTarget)return;
  const t=CFG.shop.find(x=>(x[0]===giftName||x[1]===giftName)&&x[3]==='gift');if(!t)return;
  if(!S.game.inventory[giftName]){toast('无此礼物');return}
  S.game.inventory[giftName]--;if(S.game.inventory[giftName]<=0)delete S.game.inventory[giftName];
  const store=S_giftTarget.startsWith('min')?S.game.ministers:S.game.consorts;
  store[S_giftTarget]=Math.min(100,(store[S_giftTarget]||0)+t[4]);
  addLog(S.game,'向'+npcName(S_giftTarget)+'赠「'+giftName+'」，好感+' + t[4]);
  autoSave();S.modal='npc';render();toast(npcName(S_giftTarget)+'好感 +'+t[4]);
}
function propose(npcId){
  const c=S.game.c;
  if(c.route!=='OFFICIAL'){toast('仅女官线可自主婚配');return}
  if(c.married){toast('已有夫君');return}
  if((S.game.ministers[npcId]||0)<96){toast('好感未达相许');return}
  c.married=true;c.husband=npcName(npcId);
  addLog(S.game,'奉旨与'+c.husband+'成婚，夫君助力职场。');
  autoSave();S.modal=null;render();toast('佳偶天成，与'+c.husband+'成婚');
}
function rewardServant(i){
  const sv=S.game.c.servants[i];if(!sv)return;
  if(S.game.c.silver<10){toast('赏赐需10两');return}
  S.game.c.silver-=10;sv.loyalty=Math.min(100,sv.loyalty+12);
  addLog(S.game,'赏赐侍从'+sv.name+'，忠心提升。');autoSave();render();toast(sv.name+'忠心 +12');
}
function trainServant(i){
  const sv=S.game.c.servants[i];if(!sv)return;
  if(S.game.time.ap<1){toast('行动力不足');return}
  spendAP(1);sv.ability+=8;sv.loyalty=Math.max(0,sv.loyalty-3);
  addLog(S.game,'历练侍从'+sv.name+'，才干增长。');autoSave();render();toast(sv.name+'才干 +8');
}
/* 宫人容量：妃嫔按位份分档（低2/中5/高8/皇后10），其余按职级递增 */
function staffCap(){
  const c=S.game.c;
  if(c.route==='CONSORT')return CFG.staffCapByTier[palaceTier(c)]||2;
  return Math.min(10,2+rankIdx()); // 宫女/女官：起始2，每升一级+1
}
/* 内务府雇佣宫人：受容量与银两约束，男女宫人皆入侍从册 */
function hireStaff(staffId){
  const g=S.game,c=g.c;
  const t=CFG.staffPool.find(x=>x[0]===staffId);if(!t)return;
  if((c.servants||[]).some(s=>s.id===staffId)){toast('此宫人已在身边');return}

/* 寝宫：位份分档 + 继承展开 + 点位交互 */
function palaceTier(c){
  for(const k of ['EMPRESS','HIGH','MID','LOW']) if(CFG.palaces[k].ranks.indexOf(c.rank)>=0) return k;
  return 'LOW';
}
/* 主控头像：按路线与位份取图
   宫女线：粗使/普通/管事宫女→普通宫女像，掌事姑姑→掌事姑姑像
   女官线：全职位通用一张；妃嫔线：低阶/中阶/高阶/皇后四档 */
function selfAvatar(c){
  if(c.route==='MAID'){
    const ri=CFG.ranks.MAID.findIndex(r=>r[0]===c.rank);
    return ri>=3?'self_maid_zhangshi.jpg':'self_maid_common.jpg';
  }
  if(c.route==='OFFICIAL')return 'self_official.jpg';
  return {LOW:'self_low.jpg',MID:'self_mid.jpg',HIGH:'self_high.jpg',EMPRESS:'self_empress.jpg'}[palaceTier(c)]||'self_low.jpg';
}
function palacePoints(tier){
  const order=['LOW','MID','HIGH','EMPRESS'],idx=order.indexOf(tier);
  const pos=CFG.palaces[tier].pos||{};
  let out=[];
  for(let i=0;i<=idx;i++) CFG.palaces[order[i]].points.forEach(p=>{
    const q=p.slice();q.isNew=(i===idx);const xy=pos[p[0]]||[50,50];
    q.x=xy[0];q.y=xy[1];out.push(q);
  });
  return out;
}

function childAct(p){
  const [uid,act]=p.split('|');

  if(!k)return;
  const name=k.name;
  if(act==='TEACH'&&(k.age||0)<6){toast('皇嗣需满六岁方可教导');return}

  spendAP(1);
  const deltas=[],c=g.c;
  let text='';
  // 生母好感（嫔妃子嗣的生母为NPC）
  const mother=k.mother||null;
  if(act==='VISIT'){
    text='你前往探望「'+k.name+'」，'+(k.gender==='男'?'皇子':'公主')+'眉目清秀，逗人喜爱。';
    deltas.push({t:'人脉 +2',pos:true,k:'attr'});
    c.attributes.social=Math.min(100,c.attributes.social+2);

  } else if(act==='GIFT'){
    if(c.silver<20){toast('银两不足');return}
    c.silver-=20;
    deltas.push({t:'银两 -20',pos:false,k:'res'});
    deltas.push({t:'声望 +3',pos:true,k:'res'});c.reputation+=3;
    if(mother)deltas.push(...applyEffects({}, {[mother]:8}));
    else {c.attributes.social=Math.min(100,c.attributes.social+2);deltas.push({t:'人脉 +2',pos:true,k:'attr'});}
    text='你赏赐「'+k.name+'」一批衣物玩物，'+(mother?k.motherName+'感念你的心意。':'孩儿欢喜不已。');
  } else if(act==='TEACH'){
    c.attributes.talent=Math.min(100,c.attributes.talent+3);
    c.attributes.wit=Math.min(100,c.attributes.wit+2);
    deltas.push({t:'才情 +3',pos:true,k:'attr'},{t:'心智 +2',pos:true,k:'attr'});
    text='你亲自教导「'+k.name+'」读书识字，望其成材。';
  } else if(act==='BEFRIEND'){
    c.attributes.social=Math.min(100,c.attributes.social+3);
    c.prestige+=2;
    deltas.push({t:'人脉 +3',pos:true,k:'attr'},{t:'威望 +2',pos:true,k:'res'});
    if(mother)deltas.push(...applyEffects({}, {[mother]:6}));
    text='你与「'+k.name+'」闲谈交好，并与'+k.motherName+'攀谈，关系融洽。';
  } else if(act==='ADOPT'){
    if(k.isMine||k.adopted){toast('此皇嗣无需再收为养嗣');return}
    if(c.route!=='CONSORT'){toast('仅妃嫔可收皇嗣为养子');return}
    k.adopted=true;
    c.prestige+=3;
    deltas.push({t:'收为养嗣 · '+k.name,pos:true,k:'aff'},{t:'威望 +3',pos:true,k:'res'});
    if(mother)deltas.push(...applyEffects({}, {[mother]:-8}));
    text='你奏请帝王，将'+k.name+'收为养嗣，自此其名分归你膝下。'+(mother?k.motherName+'心中不快，与你渐生嫌隙。':'宫中皆贺你得此佳儿。')+'若他有朝一日承继大统，你将以生母之尊晋封皇太后。';
    addLog(g,'收'+k.name+'为养嗣。');
  }
  if(checkDeath())return;
  const pr=tryPromote();
  S.flow={stage:'result',title:k.name+' · '+({VISIT:'探望',GIFT:'赏赐',TEACH:'教导',BEFRIEND:'结交',ADOPT:'收为养嗣'}[act]),

/* ========== 宫外 / 出宫系统 ========== */
function curMonthIdx(g){return g.time.year*12+g.time.month}
function hasPass(g){return typeof g.passToken==='number'&&g.passToken>=curMonthIdx(g)}
function passLeft(g){return hasPass(g)?(g.passToken-curMonthIdx(g)+1):0}
/* 购买出宫令牌：30两，有效期三个月（自本月起） */
function buyPassToken(){
  const g=S.game,c=g.c;
  if(c.route!=='MAID'){toast('仅宫女需出宫令牌；女官可自由出入，妃嫔不得出宫');return}
  if(hasPass(g)){toast('令牌尚在有效期内（剩 '+passLeft(g)+' 个月）');return}
  if(c.silver<CFG.pass.cost){toast('银两不足，需 '+CFG.pass.cost+' 两');return}
  c.silver-=CFG.pass.cost;
  g.passToken=curMonthIdx(g)+CFG.pass.months-1;
  addLog(g,'花 '+CFG.pass.cost+' 两购得出宫令牌，有效期三个月。');
  autoSave();render();toast('[原型] 出宫令牌已购入，有效期三个月');
}

/* 统一物品查找：常规商店 + 内务府每月货品 */
function itemDef(key){return CFG.shop.find(t=>t[0]===key||t[1]===key)||CFG.nwu.goods.find(t=>t[0]===key||t[1]===key)}
function hasPoison(){return Object.keys(S.game.inventory).some(k=>{const t=itemDef(k);return t&&t[3]==='poison'&&S.game.inventory[k]>0})}
/* 内务府每月货品：按月份确定性轮换，贿赂后额外上架稀有货 */
function refreshNwuStock(){
  const g=S.game,t=g.time,key=t.year*12+t.month;
  if(g.nwu.month===key&&g.nwu.stock&&g.nwu.stock.length)return;
  g.nwu.month=key;
  let seed=key*7919;
  const rr=()=>{seed=(seed*9301+49297)%233280;return seed/233280};
  const pool=CFG.nwu.goods.slice();
  pool.sort(()=>rr()-0.5);
  g.nwu.stock=pool.slice(0,CFG.nwu.stockSize).map(x=>x[0]);
}

/* 怀孕判定：孕率越高越易怀孕，帝宠/体质/贿赂加成；任何位份皆可 */
function tryConceive(bribed){
  const g=S.game,c=g.c;
  if(g.pregnant){return {ok:false,reason:'已有身孕'}}
  if(c.route!=='CONSORT'){return {ok:false,reason:'非秀女身份'}}
  const fert=c.attributes.fertility||50;
  let prob=0.10+fert/180+c.favor/300+c.attributes.constitution/400+(bribed?0.15:0);

  return {ok:false,prob};
}

let S_poisonTarget=null,S_poisonStaff=null;

function isInCold(g){return (g.c.inColdUntil||0)>(g.time.year*12+g.time.month)}
function demotePlayer(g,steps){
  const c=g.c,rs=CFG.ranks[c.route],ri=CFG.ranks[c.route].findIndex(r=>r[0]===c.rank);
  if(ri<=0)return 0;
  const nr=Math.max(0,ri-steps),old=c.rank;
  c.rank=rs[nr][0];
  // 若主控原占顶层席位，降位后释放
  if(g.harem){if(old==='HUANG_HOU'&&g.harem.empress==='PLAYER')g.harem.empress=null;
    if(old==='HUANG_GUI_FEI'&&g.harem.huangGuifei==='PLAYER')g.harem.huangGuifei=null;}
  return ri-nr;
}
function doPoison(itemName){
  const g=S.game,t=itemDef(itemName),pc=CFG.nwu.poison;
  if(!t||t[3]!=='poison'||!g.inventory[itemName]){toast('无此毒药');return}
  const staff=(g.c.servants||[])[S_poisonStaff];
  if(!staff){toast('请先选派一名宫人执行');return}
  g.inventory[itemName]--;if(g.inventory[itemName]<=0)delete g.inventory[itemName];
  const target=S_poisonTarget,store=target.startsWith('min')?g.ministers:g.consorts;
  const successProb=Math.min(0.95,pc.successBase+staff.ability*pc.successPerAbility);
  const exposeProb=Math.max(0.05,pc.exposeBase-staff.loyalty*pc.exposePerLoyalty);
  const success=Math.random()<successProb,caught=Math.random()<exposeProb;
  const tName=npcName(target);
  let deltas=[],text='你命宫人「'+staff.name+'」将'+t[1]+'暗中下入'+tName+'的茶盏。';

  // 毒药效果
  if(success){
    if(t[0]==='poison_deadly'&&!target.startsWith('min')){
      const npc=(g.haremNpcs||{})[target];
      if(npc&&npc.alive){npcDie(g,npc,'遭鹤顶红毒毙');text+=' 鹤顶红发作，'+npc.name+'当场毒发身亡！';deltas.push({t:npc.name+' 暴毙',pos:false,k:'aff'});}
      else {store[target]=0;text+=' '+tName+'毒发重伤。';}
    } else {
      const cut=t[0]==='poison_deadly'?60:25;
      store[target]=Math.max(0,(store[target]||0)-cut);
      text+=(t[0]==='poison_strong'?'药性猛烈，对方当场面色铁青。':t[0]==='poison_deadly'?'对方毒发倒地，命悬一线。':'对方饮后身形一晃，似觉不适。');
      deltas.push({t:tName+'好感 -'+cut,pos:false,k:'aff'});
    }
  } else {
    text+=' 奈何'+staff.name+'办事不周，毒性未起，'+tName+'安然无恙。';
  }

  // 败露与惩罚
  if(caught){
    const lowLoy=staff.loyalty<pc.lowLoyalty, lowAb=staff.ability<pc.lowAbility;
    // 供出主控且情节极端 → 可能赐死
    if(lowLoy&&Math.random()<pc.deathProb){
      addLog(g,'向'+tName+'下毒败露，'+staff.name+'供出主谋，你被赐死。');
      setEnding('execution');return;
    }
    const sev=lowLoy?'betray':(lowAb||!success)?'botch':'plain';
    const p=pc[sev];
    const fine=Math.floor(g.c.silver*(p.silver||0));g.c.silver-=fine;
    if(fine>0)deltas.push({t:'罚俸 -'+fine+'两',pos:false,k:'res'});
    if(p.demote){const d=demotePlayer(g,p.demote);if(d>0)deltas.push({t:'降位 '+d+' 级',pos:false,k:'aff'});}
    if(p.cold){g.c.inColdUntil=g.time.year*12+g.time.month+p.cold;deltas.push({t:'幽禁冷宫 '+p.cold+' 月',pos:false,k:'aff'});}
    if(p.prestige){g.c.prestige=Math.max(0,g.c.prestige+p.prestige);deltas.push({t:'威望 '+p.prestige,pos:false,k:'res'});}
    if(p.reputation){g.c.reputation=Math.max(0,(g.c.reputation||0)+p.reputation);deltas.push({t:'声望 '+p.reputation,pos:false,k:'res'});}
    text+= sev==='betray' ? ' 不想'+staff.name+'忠心不定，一经盘问便供出了你！龙颜震怒，罚俸、降位，并将你幽禁冷宫反省。'
         : sev==='botch' ? ' '+staff.name+'才干不足，失手留下痕迹，事情败露。你因此罚俸、降位，并被幽禁冷宫。'
         : ' 不想事迹败露，宫中流言四起，你被罚俸并损了威望声望。';
    addLog(g,'向'+tName+'下毒败露（'+(sev==='betray'?'被供出':sev==='botch'?'失手':'普通')+'），受罚。');
  } else {
    addLog(g,'命'+staff.name+'向'+tName+'下'+t[1]+'。'+(success?'（得手）':'（未成）'));
  }
  if(checkDeath())return;
  S_poisonStaff=null;
  S.flow={stage:'result',title:caught?'毒计败露':'暗施毒计',resultText:text,deltas,promoted:null,yearEnd:false};
  S.modal='event';autoSave();render();
}

/* 选择事件选项 */
/* 地图事件：判定选项是否含正向收益 */
function hasPositive(e,a){
  for(const k in e){if(k==='attributes'){for(const x in e.attributes)if(e.attributes[x]>0)return true}
    else if(e[k]>0)return true}
  if(a)for(const id in a)if(a[id]>0)return true;
  return false;
}
/* 地图事件失败：正向收益反转为扣减（幅度按比例，至少1），负向不变 */
function failEffects(e,a){
  const ratio=CFG.eventFail.penaltyRatio,eff={},aff={};
  for(const k in e){
    if(k==='attributes'){
      eff.attributes={};
      for(const x in e.attributes){const v=e.attributes[x];eff.attributes[x]=v>0?-Math.max(1,Math.round(v*ratio)):v}
      continue;
    }
    const v=e[k];eff[k]=v>0?-Math.max(1,Math.round(v*ratio)):v;
  }
  if(a)for(const id in a){const v=a[id];aff[id]=v>0?-Math.max(1,Math.round(v*ratio)):v}
  return {eff,aff};
}
function chooseOption(i){
  const f=S.flow,ch=f.event.c[i];

    f.deltas=[];f.resultText='你打消了偷溜的念头，转身回去想办法弄一张令牌。';
    f.stage='result';render();autoSave();return;
  }
  if(ch.special==='sneakGo'){leavePalace('sneak');return}
  // 地图互动选项：正向收益有概率失败，反转为扣减相关属性
  let eff=ch.e||{},aff=ch.a||{},failNote='';
  if(f.mapEvent&&!ch.special&&Math.random()<CFG.eventFail.prob&&hasPositive(eff,aff)){
    const r=failEffects(eff,aff);eff=r.eff;aff=r.aff;failNote='事与愿违，';
  }
  f.deltas=applyEffects(eff,aff);
  f.resultText=failNote+ch.r;
  if(ch.special==='conceive'){
    const c=S.game.c;
    const res=tryConceive(false);
    if(res.ok)f.deltas.push({t:'已有身孕 · 十月后临盆',pos:true,k:'aff'});

    else f.resultText+='（此次未能有孕，孕率越高越易怀上，可再试）';
  } else if(ch.special==='pregnantStop'){
    // 听劝作罢：不耗行动力，胎气安稳，帝宠略增
    f.deltas.push(...applyEffects({favor:1},{}));
    f.resultText='你婉言推却，回禀圣驾身子不适。帝王体恤，赐下安胎药材，你安然返回，胎气安稳。';
    addLog(S.game,'孕期听劝作罢，安心养胎。');
  } else if(ch.special==='pregnantForce'){
    // 执意侍寝：耗1行动力，体质低则小产风险更高
    spendAP(1);
    const c=S.game.c;

    if(Math.random()<risk){
      S.game.pregnant=null;
      f.deltas.push({t:'小产 · 失去身孕',pos:false,k:'aff'},
        ...applyEffects({constitution:-12,favor:-5,prestige:-5},{}));
      f.resultText='你执意承恩，然胎气本就不稳。夜半忽觉腹痛如绞，太医匆忙诊治，终是没能保住孩儿。你痛彻心扉，龙颜亦为之不悦。';
      addLog(S.game,'孕期执意侍寝，不幸小产。');
    } else {
      f.deltas.push({t:'侥幸保胎 · 但损体质',pos:false,k:'aff'},
        ...applyEffects({favor:6,constitution:-5},{}));
      f.resultText='你执意承恩，所幸胎气尚稳，太医来诊后言无大碍。只是此后需倍加小心，你暗自记下这次惊险。';
      addLog(S.game,'孕期执意侍寝，所幸有惊无险。');
    }
  }
  if(checkDeath())return;
  const pr=tryPromote();if(pr)f.promoted=pr;
  f.stage='result';render();autoSave();
}
/* 办理差事 */
function doDuty(id){
  const c=S.game.c;
  if(S.game.time.ap<1){toast('行动力不足');return}
  const def=DUTIES[c.route].find(d=>d.id===id);if(!def)return;
  spendAP(def.cost);
  const success=Math.random()<(1-def.diff);
  const deltas=success?applyEffects(def.rw,{}):applyEffects({},{});
  if(checkDeath())return;
  if(!success)deltas.push({t:'差事失利',pos:false,k:'res'});
  let promoted=null;
  if(success&&def.promote&&c.rank===def.promote){
    const rs=CFG.ranks[c.route],idx=rs.findIndex(r=>r[0]===c.rank);
    if(idx<rs.length-1){c.rank=rs[idx+1][0];promoted=rs[idx+1][1];addLog(S.game,'晋升为「'+promoted+'」！')}
  }
  if(success)addLog(S.game,'完成差事「'+def.name+'」。');
  S.flow={stage:'result',title:def.name,resultText:success?'差事办理妥当，收获颇丰。':'差事办砸了，蒙受损失。',
    deltas,promoted,yearEnd:false};
  S.modal='event';render();autoSave();
}

/* ---------- 7. 启动 ---------- */
render();
</script>
